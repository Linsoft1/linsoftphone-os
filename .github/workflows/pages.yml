# Nasazeni na GitHub Pages: stranka projektu (web/) -> https://<uzivatel>.github.io/linsoftphone-os/
# a LinsoftPhone OS (pwa/) -> .../linsoftphone-os/app/
name: Web a PWA na GitHub Pages

on:
  push:
    branches: [main]
    paths: ["pwa/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/zostav.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
