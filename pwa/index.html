<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinsoftOS">
<meta name="format-detection" content="telephone=no">
<title>LinsoftPhone OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="phone">

  <!-- uvodni obrazovka pri startu (logo LinsoftPhone OS) -->
  <div id="boot" aria-hidden="true">
    <img id="boot-logo" src="icons/logo.svg" alt="">
    <div id="boot-nazev">LinsoftPhone OS</div>
    <div id="boot-pruh"><span></span></div>
  </div>

  <!-- stavovy radek -->
  <div id="statusbar" role="button" tabindex="0" data-i18n-label="notif">
    <span id="sb-time">00:00</span>
    <span id="sb-operator">Linsoft 5G</span>
    <span id="sb-right">
      <span id="sb-alarm" hidden>⏰</span>
      <span id="sb-net">📶</span>
      <span id="sb-batt">🔋 100 %</span>
    </span>
  </div>

  <!-- zamykaci obrazovka -->
  <div id="lockscreen" class="screen visible">
    <div id="lock-clock">00:00</div>
    <div id="lock-date"></div>
    <div id="lock-hint" data-i18n="lock_hint"></div>
    <div id="lock-pin" hidden>
      <div id="lock-pin-title" class="pin-title" data-i18n="pin_zadej"></div>
      <div id="lock-pin-box"></div>
    </div>
  </div>

  <!-- plocha -->
  <div id="homescreen" class="screen visible">
    <div id="widget-clock">
      <div id="w-time">00:00</div>
      <div id="w-date"></div>
    </div>
    <div id="appgrid"></div>
    <div id="dock"></div>
  </div>

  <!-- bezici aplikace -->
  <div id="appscreen" class="screen">
    <div id="app-header">
      <button id="app-back" data-i18n-label="zpet">←</button>
      <h1 id="app-title"></h1>
    </div>
    <div id="app-content"></div>
  </div>

  <!-- nedavne aplikace -->
  <div id="recents" class="screen">
    <h2 data-i18n="nedavne"></h2>
    <div id="recents-list"></div>
    <button class="btn ghost" id="recents-clear" data-i18n="zavri_vse"></button>
  </div>

  <!-- panel notifikaci -->
  <div id="notifpanel" aria-live="polite">
    <div id="notif-head">
      <strong data-i18n="notif"></strong>
      <button id="notif-clear" data-i18n="notif_vymaz"></button>
    </div>
    <div id="notif-list"></div>
    <div id="quick-tiles">
      <button class="tile" data-tile="torch">🔦<br><span data-i18n="tile_torch"></span></button>
      <button class="tile" data-tile="motiv">🌗<br><span data-i18n="tile_motiv"></span></button>
      <button class="tile" data-tile="full">⛶<br><span data-i18n="tile_full"></span></button>
      <button class="tile" data-tile="zamek">🔒<br><span data-i18n="tile_zamek"></span></button>
    </div>
    <div id="notif-grip"></div>
  </div>

  <!-- zvonici budik / minutka -->
  <div id="alarm" role="alertdialog" hidden>
    <div id="alarm-icon">⏰</div>
    <div id="alarm-text"></div>
    <button class="btn" id="alarm-stop" data-i18n="vypnout"></button>
  </div>

  <!-- navigacni lista -->
  <nav id="navbar">
    <button id="nav-back" data-i18n-label="zpet">◁</button>
    <button id="nav-home" data-i18n-label="domu">◯</button>
    <button id="nav-recent" data-i18n-label="nedavne">▢</button>
  </nav>

</div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
